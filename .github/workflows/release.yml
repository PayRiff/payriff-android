name: Release

# A version tag (for example 1.0.0-rc.1) publishes com.payriff:payriff-android to Payriff's
# Maven repository on GitHub Pages (the gh-pages branch, https://payriff.github.io/payriff-android/maven),
# then creates the GitHub release. A version that is already there is never overwritten.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match VERSION_NAME
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          test "$version" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME $version"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :payriff:testDebugUnitTest :payriff:lintRelease
      - name: Check out the Maven repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish to the Maven repository
        run: |
          if [ -e "pages/maven/com/payriff/payriff-android/$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is already published; not overwriting it."
            exit 0
          fi
          ./gradlew :payriff:publishAllPublicationsToGithubPagesRepository -PpagesMavenDir="$GITHUB_WORKSPACE/pages/maven"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven
          git commit -m "Publish com.payriff:payriff-android:$GITHUB_REF_NAME"
          git push
      - name: Release notes from the CHANGELOG
        run: awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $flags
